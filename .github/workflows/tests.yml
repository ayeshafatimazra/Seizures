name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # the unit tests exercise pure-Python / numpy / scipy / sklearn code paths
      # (MNE and torch are imported lazily and not needed here), so install a
      # light set to keep CI fast.
      - run: pip install numpy scipy scikit-learn pytest
      - run: pytest -q
